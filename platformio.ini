; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = featheresp32

; Shared settings for all envs
[env]
framework = arduino
platform = espressif32
board = featheresp32
upload_protocol = esptool
board_build.partitions = no_ota.csv
lib_deps =
    bxparks/AUnit@^1.6.1
    sparkfun/SparkFun u-blox GNSS Arduino Library @ ^2.2.9
    sparkfun/SparkFun BNO080 Cortex Based IMU @ ^1.1.11
    lennarthennigs/Button2@^1.6.1
monitor_speed = 115200
monitor_filters = time
upload_port = /dev/cu.SLAB_USBtoUART
monitor_port = /dev/cu.SLAB_USBtoUART
test_port = /dev/cu.SLAB_USBtoUART

; Production build: DEBUGGING defaults to 0, serial logging (DBG) is silent.
[env:featheresp32]

; Debug build: DBG output on the serial monitor. Use this env when iterating
; against attached hardware, so observing the device needs no source edit.
[env:featheresp32_debug]
build_flags = -DDEBUGGING=1
