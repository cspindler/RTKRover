; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = featheresp32

; Shared settings for all envs
[env]
framework = arduino
platform = espressif32
board = featheresp32
upload_protocol = esptool
; Two OTA slots (app0/app1, 0x1E0000 = 1.92 MB each) + otadata, 128 KB spiffs
; (unused), 64 KB coredump. Decided 2026-09-11: the stock default.csv slots
; (1.25 MB) are too small for this ~1.6 MB image; min_spiffs.csv fits it with
; ~300 KB headroom. Changing the table needs one USB flash per unit.
board_build.partitions = min_spiffs.csv
lib_deps =
    bxparks/AUnit@^1.6.1
    sparkfun/SparkFun u-blox GNSS Arduino Library @ ^2.2.9
    sparkfun/SparkFun BNO080 Cortex Based IMU @ ^1.1.11
monitor_speed = 115200
monitor_filters = time
extra_scripts =
    pre:tools/git_version.py
    pre:tools/gen_assembly_config.py
; No *_port keys on purpose: the port embeds the CP2104 serial number, so a
; hardcoded value silently goes stale when units are swapped. tools/flash.sh
; and tools/watch.sh discover the attached unit via tools/known-boards.txt and
; pass the port explicitly; bare pio commands fall back to auto-detection.

; Production build: DEBUGGING defaults to 0, serial logging (DBG) is silent.
[env:featheresp32]

; Debug build: DBG output on the serial monitor. Use this env when iterating
; against attached hardware, so observing the device needs no source edit.
[env:featheresp32_debug]
build_flags = -DDEBUGGING=1
