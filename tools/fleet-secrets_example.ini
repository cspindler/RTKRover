# Template for tools/fleet-secrets.ini (gitignored; copy this file and fill
# in real values). Optional since ADR-001.
#
# The firmware embeds no secrets any more: the caster credentials are typed
# into RWA Player (Settings, next to Unit ID) and the phone's hotspot is not
# used. This file is the fleet's record of those per-unit facts, for
# provisioning the phones; the only thing the firmware build reads from it
# is an optional `ble_name` override per assembly section
# (tools/gen_assembly_config.py).
#
# Section names are the assembly labels from the committed
# tools/known-boards.txt (CP2104 serial -> label). The BLE name defaults to
# that label, so sticker and BLE scan show the same identity; set ble_name
# only to override it. Names must be unique across the fleet and at most
# 29 bytes.

[caster]
host = rtk2go.com
port = 2101
mount = YOUR_MOUNT_POINT
pass =

[rwa-hs-1]
caster_user = YOUR_CASTER_USER_01
# ble_name = rwa-hs-1

[rwa-hs-2]
caster_user = YOUR_CASTER_USER_02
