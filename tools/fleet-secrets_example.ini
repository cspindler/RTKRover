# Template for tools/fleet-secrets.ini (which is gitignored. Copy this file
# and fill in real values).

# fleet secrets (gitignored)
#
# single source of truth for NTRIP caster secrets,
# WiFi hotspot credentials, and headset assembly label.
#
# the committed tools/known-boards.txt maps CP2104 serials
# to the assembly labels used as section names below.
#
# tools/gen_caster_secrets.py joins the two by assembly label at build time
# and generates src/CasterSecrets.h for the selected assembly
# (RTK_BOARD env var naming the assembly label, or the single attached board).
#
# Conventions:
#   - WiFi SSID = assembly label = unit label. Name each unit's phone hotspot after
#     it (e.g. "rwa-hs-1"). Override with wifi_ssid when using another hotspot.
#   - BLE name = assembly label too, so sticker, hotspot and BLE scan all show
#     the same identity. Set ble_name only to override. Names must be unique
#     across the fleet and at most 29 bytes.
#
# [caster] holds shared caster settings; any of them can be overridden per
# assembly with caster_host / caster_port / caster_mount / caster_user /
# caster_pass in that assembly's section.

[caster]
host = rtk2go.com
port = 2101
mount = YOUR_MOUNT_POINT
pass =

[rwa-hs-1]
caster_user = YOUR_CASTER_USER_01
wifi_pw = HOTSPOT_PASSWORD_OF_UNIT_1

[rwa-hs-2]
caster_user = YOUR_CASTER_USER_02
wifi_pw = HOTSPOT_PASSWORD_OF_UNIT_2
