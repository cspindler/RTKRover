# Template for tools/fleet-secrets.ini (which is gitignored -- copy this file
# and fill in real values). It is the single source of truth for everything
# secret; the committed tools/known-boards.txt maps CP2104 serials to the board
# labels used as section names below.
#
# tools/gen_caster_secrets.py joins the two by board label at build time and
# generates src/CasterSecrets.h for the selected unit (RTK_BOARD env var, or
# the single attached board).
#
# Conventions:
#   - WiFi SSID = board label. Name each phone hotspot after its unit
#     (e.g. "rwa-hs-1"). Set wifi_ssid only to override, e.g. during migration.
#   - BLE name is derived from the chip ID at runtime; it is not configured here.
#
# [caster] holds shared caster settings; any of them can be overridden per
# board with caster_host / caster_port / caster_mount / caster_user /
# caster_pass in that board's section.

[caster]
host = rtk2go.com
port = 2101
mount = YOUR_MOUNT_POINT
pass =

[rwa-hs-1]
caster_user = YOUR_CASTER_USER_01
wifi_pw = HOTSPOT_PASSWORD_OF_UNIT_1

[rwa-hs-2]
caster_user = YOUR_CASTER_USER_02
wifi_pw = HOTSPOT_PASSWORD_OF_UNIT_2
